<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pen Draw</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Pen Draw">
<style>
  :root { --bar-h: 60px; --accent: #1a3d9c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f1; font-family: -apple-system, system-ui, sans-serif; color: #111; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: #ffffff; border-bottom: 2px solid #b8b8b8;
    overflow-x: auto; z-index: 10;
  }
  #toolbar button, #gridSpacing {
    min-width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid #8a8a8a;
    background: #ffffff; color: #111; font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  #toolbar button.active { background: #dbe7ff; border-color: var(--accent); outline: 3px solid var(--accent); outline-offset: 1px; }
  #toolbar button:disabled { opacity: 0.35; }
  #toolbar button.text-btn { font-size: 15px; font-weight: 600; padding: 0 10px; }
  #gridSpacing { font-size: 15px; font-weight: 600; padding: 0 6px; }

  .swatch { width: 30px !important; min-width: 30px !important; height: 30px !important; border-radius: 50% !important; padding: 0; border: 2px solid #fff !important; box-shadow: 0 0 0 1.5px #5a5a5a; }
  .swatch.active { box-shadow: 0 0 0 3px var(--accent); }
  input.custom { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #5a5a5a; padding: 0; cursor: pointer; background: none; flex-shrink: 0; }
  input.custom::-webkit-color-swatch-wrapper { padding: 0; }
  input.custom::-webkit-color-swatch { border: none; border-radius: 50%; }
  input.custom.active { box-shadow: 0 0 0 3px var(--accent); }
  .sep { width: 2px; height: 30px; background: #b0b0b0; flex-shrink: 0; }

  /* Slider: dark track and thumb so it reads clearly */
  #size { -webkit-appearance: none; appearance: none; width: 150px; height: 30px; flex-shrink: 0; background: transparent; margin: 0; }
  #size::-webkit-slider-runnable-track { height: 8px; background: #4a4a4a; border-radius: 4px; }
  #size::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1.5px #000; }
  #size::-moz-range-track { height: 8px; background: #4a4a4a; border-radius: 4px; }
  #size::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1.5px #000; }
  #size:disabled { opacity: 0.35; }
  #sizeLabel { font-size: 16px; font-weight: 700; color: #111; min-width: 30px; text-align: center; flex-shrink: 0; }

  #stage { position: fixed; top: var(--bar-h); left: 0; right: 0; bottom: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #fff; }

  #layerPanel {
    position: fixed; top: calc(var(--bar-h) + 8px); right: 10px; width: 310px; max-height: 65vh; overflow-y: auto;
    background: #ffffff; border: 2px solid #8a8a8a; border-radius: 14px; padding: 10px; z-index: 15;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  }
  #layerPanel[hidden] { display: none; }
  .lp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 16px; }
  .lp-actions button { min-width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid #8a8a8a; background: #fff; font-size: 17px; margin-left: 4px; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 6px; border: 1.5px solid #aaa; border-radius: 10px; margin-bottom: 6px; background: #fff; cursor: pointer; }
  .layer-row.active { border-color: var(--accent); background: #e4ecff; box-shadow: inset 0 0 0 1px var(--accent); }
  .layer-row button { min-width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid #8a8a8a; background: #fff; font-size: 15px; flex-shrink: 0; }
  .layer-row button:disabled { opacity: 0.35; }
  .layer-row .lname { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-row input[type=range] { width: 70px; flex-shrink: 0; accent-color: var(--accent); }

  #version {
    position: fixed; right: 10px; bottom: 8px; z-index: 10;
    font-size: 13px; font-weight: 600; color: #222; background: #fff;
    border: 1px solid #999; padding: 3px 9px; border-radius: 6px; pointer-events: none;
  }
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 8px 14px; border-radius: 8px;
    font-size: 15px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="selectBtn" data-group="tool" title="Select, move, and resize">↖</button>
  <button id="penBtn" class="active" data-group="tool" title="Pen">✏️</button>
  <button id="eraserBtn" data-group="tool" title="Eraser">🧽</button>
  <button id="rectBtn" data-group="tool" title="Rectangle">▭</button>
  <button id="ovalBtn" data-group="tool" title="Oval">○</button>
  <button id="arcBtn" data-group="tool" title="Arc: drag from one end to the other">◠</button>
  <button id="fillBtn" class="text-btn" data-group="tool" title="Fill area">Fill</button>
  <div class="sep"></div>
  <button class="swatch active" data-group="color" data-color="#111111" style="background:#111" title="Black"></button>
  <button class="swatch" data-group="color" data-color="#e03131" style="background:#e03131" title="Red"></button>
  <button class="swatch" data-group="color" data-color="#1c7ed6" style="background:#1c7ed6" title="Blue"></button>
  <button class="swatch" data-group="color" data-color="#2f9e44" style="background:#2f9e44" title="Green"></button>
  <button class="swatch" data-group="color" data-color="#f08c00" style="background:#f08c00" title="Orange"></button>
  <button class="swatch" data-group="color" data-color="#7048e8" style="background:#7048e8" title="Purple"></button>
  <div class="sep"></div>
  <input class="custom" data-group="color" data-idx="0" type="color" value="#ffffff" title="Custom colour 1">
  <input class="custom" data-group="color" data-idx="1" type="color" value="#868e96" title="Custom colour 2">
  <input class="custom" data-group="color" data-idx="2" type="color" value="#495057" title="Custom colour 3">
  <input class="custom" data-group="color" data-idx="3" type="color" value="#ffd43b" title="Custom colour 4">
  <input class="custom" data-group="color" data-idx="4" type="color" value="#69db7c" title="Custom colour 5">
  <input class="custom" data-group="color" data-idx="5" type="color" value="#4dabf7" title="Custom colour 6">
  <div class="sep"></div>
  <input id="size" type="range" min="1" max="30" value="4" title="Brush, eraser, or outline width">
  <span id="sizeLabel">4</span>
  <div class="sep"></div>
  <button id="solidBtn" title="Filled shapes">■</button>
  <button id="curveBtn" class="text-btn active" data-group="mode" title="Smooth curves">Curve</button>
  <button id="lineBtn" class="text-btn" data-group="mode" title="Straight lines">Line</button>
  <button id="gridBtn" title="Show grid">▦</button>
  <button id="snapBtn" title="Snap to grid">⊞</button>
  <select id="gridSpacing" title="Grid spacing">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="40" selected>40</option>
    <option value="80">80</option>
  </select>
  <button id="resetViewBtn" title="Reset zoom">⤢</button>
  <button id="layersBtn" title="Layers">▤</button>
  <div class="sep"></div>
  <button id="undoBtn" title="Undo" disabled>↶</button>
  <button id="redoBtn" title="Redo" disabled>↷</button>
  <button id="delBtn" title="Delete selected" disabled>⌫</button>
  <button id="clearBtn" title="Clear all">🗑</button>
  <button id="saveBtn" title="Save PNG">💾</button>
  <button id="copyBtn" title="Copy drawing to clipboard" aria-label="Copy drawing to clipboard">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
  </button>
</div>

<div id="layerPanel" hidden>
  <div class="lp-head">
    <strong>Layers</strong>
    <span class="lp-actions">
      <button id="addLayer" title="Add layer">＋</button>
      <button id="delLayer" title="Delete layer">−</button>
      <button id="closeLayers" title="Close">✕</button>
    </span>
  </div>
  <div id="layerList"></div>
</div>

<div id="stage">
  <canvas id="c"></canvas>
</div>

<div id="version">v0.6.0</div>
<div id="toast"></div>

<script>
(() => {
  // Bump this when you make a change you want to track
  const APP_VERSION = '0.6.0';
  document.getElementById('version').textContent = 'v' + APP_VERSION;

  const $ = id => document.getElementById(id);
  const canvas = $('c');
  const ctx = canvas.getContext('2d');
  const SHAPES = ['rect', 'oval', 'arc'];
  const MIN_SCALE = 0.5, MAX_SCALE = 6;
  const HISTORY_LIMIT = 200;
  const CUSTOM_KEY = 'pendraw-custom-colors';
  const dpr = () => window.devicePixelRatio || 1;

  // ---------- state ----------
  // Items, in drawing order. Each carries the id of the layer it belongs to:
  //   freehand/line: {layer, color, size, eraser, straight, pointerType, points:[{x,y,p}]}
  //   shape:         {layer, shape:'rect'|'oval'|'arc', color, size, filled, side, points:[a,b]}
  //   fill:          {layer, fill:true, color, x, y}   (not selectable)
  // Items and layers are never edited in place; changes create new objects. That
  // makes history a list of earlier snapshots.
  let strokes = [];
  let layers = [{ id: 'L1', name: 'Layer 1', visible: true, opacity: 1 }];  // bottom to top
  let activeLayer = 'L1';
  let layerSeq = 1;
  const layerCanvases = new Map();    // layer id -> offscreen canvas holding that layer's ink

  let undoStack = [], redoStack = [];
  let current = null;        // item being drawn
  let preview = null;        // line or shape being dragged out (not yet committed)
  let selected = null;       // selected item
  let drag = null;           // move or resize in progress
  let tool = 'pen';          // 'select' | 'pen' | 'eraser' | 'rect' | 'oval' | 'arc' | 'fill'
  let mode = 'curve';        // 'curve' | 'line' (pen only)
  let color = '#111111';
  let penSize = 4;
  let eraserSize = 24;
  let shapeFilled = false;
  let showGrid = false;
  let snap = false;
  let GRID = 40;             // grid spacing and snap step, in drawing units
  let penInUse = false;      // once the Pencil is used, finger touches are ignored for drawing
  let activePointerId = null;
  let view = { scale: 1, ox: 0, oy: 0 };  // zoom and pan, in CSS pixels
  const touches = new Map(); // active finger touches, used for pinch
  let gesture = null;        // pinch state
  let rafId = 0, pendingFull = false;

  // ---------- custom colours (saved on this device) ----------
  function loadCustom() {
    try {
      const a = JSON.parse(localStorage.getItem(CUSTOM_KEY));
      if (Array.isArray(a) && a.length === 6) return a;
    } catch (e) {}
    return ['#ffffff', '#868e96', '#495057', '#ffd43b', '#69db7c', '#4dabf7'];
  }
  function saveCustom(list) {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); } catch (e) {}
  }
  let customColors = loadCustom();

  // ---------- layers: canvases ----------
  function layerCanvas(id) {
    let lc = layerCanvases.get(id);
    if (!lc) {
      lc = document.createElement('canvas');
      lc.width = canvas.width;
      lc.height = canvas.height;
      layerCanvases.set(id, lc);
    }
    return lc;
  }
  const layerCtx = id => layerCanvas(id).getContext('2d');

  // ---------- sizing ----------
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const d = dpr();
    canvas.width = Math.round(rect.width * d);
    canvas.height = Math.round(rect.height * d);
    for (const lc of layerCanvases.values()) {
      lc.width = canvas.width;
      lc.height = canvas.height;
    }
    redrawInk();
  }
  window.addEventListener('resize', resize);

  // ---------- geometry helpers ----------
  function setTransform(c) {
    const d = dpr(), s = view.scale;
    c.setTransform(d * s, 0, 0, d * s, d * view.ox, d * view.oy);
  }
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const box = (a, b) => ({ x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y), x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y) });
  const snapPt = p => ({ ...p, x: Math.round(p.x / GRID) * GRID, y: Math.round(p.y / GRID) * GRID });

  // Bounding box of an item's points (no stroke width)
  function rawBox(s) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of s.points) {
      x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
      x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
    }
    return { x0, y0, x1, y1 };
  }

  function distSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  // ---------- drawing ----------
  function widthFor(stroke, p) {
    if (stroke.eraser) return stroke.size;
    return Math.max(0.5, stroke.size * (0.4 + p * 1.2));
  }

  function styleFor(c, stroke) {
    c.globalCompositeOperation = stroke.eraser ? 'destination-out' : 'source-over';
    c.strokeStyle = stroke.color;
    c.fillStyle = stroke.color;
    c.lineCap = 'round';
    c.lineJoin = 'round';
  }

  // Midpoint smoothing: each curve runs between midpoints, with the real point as
  // the control, so consecutive curves join with no gaps.
  function drawSegment(c, stroke, pts, i) {
    const n = pts.length;
    const start = i === 1 ? pts[0] : mid(pts[i - 2], pts[i - 1]);
    const control = pts[i - 1];
    const end = i === n - 1 ? pts[i] : mid(pts[i - 1], pts[i]);
    c.save();
    styleFor(c, stroke);
    c.lineWidth = widthFor(stroke, (pts[i - 1].p + pts[i].p) / 2);
    c.beginPath();
    c.moveTo(start.x, start.y);
    c.quadraticCurveTo(control.x, control.y, end.x, end.y);
    c.stroke();
    c.restore();
  }

  // Rectangle, oval, or arc. The arc is a half circle from the pen-down point to
  // the pen-up point. It bulges toward the side the pen first moved toward (s.side).
  function shapePath(c, s, closed) {
    const [a, b] = s.points;
    c.beginPath();
    if (s.shape === 'arc') {
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
      if (len > 0) {
        const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2, r = len / 2;
        const side = s.side || 1;
        const thA = Math.atan2(a.y - cy, a.x - cx);
        const thN = Math.atan2(dx * side, -dy * side);   // direction of the bulge
        let diff = thN - thA;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        if (diff > 0) c.arc(cx, cy, r, thA, thA + Math.PI, false);
        else c.arc(cx, cy, r, thA, thA - Math.PI, true);
      }
      if (closed) c.closePath();   // closing chord back to the start point
      return;
    }
    const bx = box(a, b);
    const w = bx.x1 - bx.x0, h = bx.y1 - bx.y0;
    if (s.shape === 'rect') { c.rect(bx.x0, bx.y0, w, h); return; }
    c.ellipse(bx.x0 + w / 2, bx.y0 + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  }

  function drawShape(c, s) {
    c.save();
    styleFor(c, s);
    if (s.filled) {
      shapePath(c, s, true);
      c.fill();
    }
    shapePath(c, s, false);
    c.lineWidth = s.size;
    c.stroke();
    c.restore();
  }

  function drawStroke(c, stroke) {
    if (stroke.fill) return;                 // fills are applied to layer ink in redrawInk
    if (stroke.shape) { drawShape(c, stroke); return; }
    const pts = stroke.points;
    if (stroke.straight && pts.length >= 2) {
      c.save();
      styleFor(c, stroke);
      c.lineWidth = widthFor(stroke, pts[0].p);
      c.beginPath();
      c.moveTo(pts[0].x, pts[0].y);
      c.lineTo(pts[1].x, pts[1].y);
      c.stroke();
      c.restore();
      return;
    }
    if (pts.length === 1) {
      c.save();
      styleFor(c, stroke);
      c.beginPath();
      c.arc(pts[0].x, pts[0].y, widthFor(stroke, pts[0].p) / 2, 0, Math.PI * 2);
      c.fill();
      c.restore();
      return;
    }
    for (let i = 1; i < pts.length; i++) drawSegment(c, stroke, pts, i);
  }

  // Paint-bucket fill on one layer's ink: fills the connected area matching the
  // colour under the seed point (usually transparent space).
  function floodFill(f, c) {
    const W = c.canvas.width, H = c.canvas.height;
    const d = dpr(), k = view.scale;
    const sx = Math.round((f.x * k + view.ox) * d);
    const sy = Math.round((f.y * k + view.oy) * d);
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;

    const img = c.getImageData(0, 0, W, H);
    const data = img.data;
    const seed = (sy * W + sx) * 4;
    const tr = data[seed], tg = data[seed + 1], tb = data[seed + 2], ta = data[seed + 3];
    const fr = parseInt(f.color.slice(1, 3), 16);
    const fg = parseInt(f.color.slice(3, 5), 16);
    const fb = parseInt(f.color.slice(5, 7), 16);
    if (tr === fr && tg === fg && tb === fb && ta === 255) return;   // already this colour

    const TOL = 24;
    const match = o => Math.abs(data[o] - tr) + Math.abs(data[o + 1] - tg) +
                       Math.abs(data[o + 2] - tb) + Math.abs(data[o + 3] - ta) <= TOL;
    const visited = new Uint8Array(W * H);
    const stack = [sx, sy];

    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      if (visited[y * W + x] || !match((y * W + x) * 4)) continue;
      let x1 = x, x2 = x;
      while (x1 > 0 && !visited[y * W + x1 - 1] && match((y * W + x1 - 1) * 4)) x1--;
      while (x2 < W - 1 && !visited[y * W + x2 + 1] && match((y * W + x2 + 1) * 4)) x2++;
      for (let i = x1; i <= x2; i++) {
        const q = y * W + i;
        visited[q] = 1;
        const o = q * 4;
        data[o] = fr; data[o + 1] = fg; data[o + 2] = fb; data[o + 3] = 255;
      }
      for (const ny of [y - 1, y + 1]) {
        if (ny < 0 || ny >= H) continue;
        let inRun = false;
        for (let i = x1; i <= x2; i++) {
          const q = ny * W + i;
          const ok = !visited[q] && match(q * 4);
          if (ok && !inRun) { stack.push(i, ny); inRun = true; }
          else if (!ok) inRun = false;
        }
      }
    }
    c.putImageData(img, 0, 0);
  }

  function drawGrid() {
    const d = dpr(), s = view.scale;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const x0 = -view.ox / s, x1 = (w - view.ox) / s;
    const y0 = -view.oy / s, y1 = (h - view.oy) / s;
    ctx.setTransform(d * s, 0, 0, d * s, d * view.ox, d * view.oy);
    ctx.strokeStyle = '#c9d3df';
    ctx.lineWidth = 1 / s;   // one screen pixel at any zoom
    ctx.beginPath();
    for (let x = Math.floor(x0 / GRID) * GRID; x <= x1; x += GRID) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / GRID) * GRID; y <= y1; y += GRID) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
  }

  // Selection outline plus corner handles, drawn in world space at screen-sized scale
  function drawSelection(c) {
    const b = rawBox(selected), s = view.scale;
    const pad = (selected.size || 0) / 2 + 3 / s;
    const h = 7 / s;
    c.save();
    c.strokeStyle = '#1a3d9c';
    c.lineWidth = 1.5 / s;
    c.setLineDash([6 / s, 4 / s]);
    c.strokeRect(b.x0 - pad, b.y0 - pad, (b.x1 - b.x0) + 2 * pad, (b.y1 - b.y0) + 2 * pad);
    c.setLineDash([]);
    c.fillStyle = '#ffffff';
    c.lineWidth = 2 / s;
    for (const [x, y] of [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]]) {
      c.beginPath();
      c.rect(x - h, y - h, 2 * h, 2 * h);
      c.fill();
      c.stroke();
    }
    c.restore();
  }

  // Rebuild every layer's ink from the item list (needed after zoom, pan, undo, or resize)
  function redrawInk() {
    for (const id of [...layerCanvases.keys()]) {
      if (!layers.some(l => l.id === id)) layerCanvases.delete(id);
    }
    for (const l of layers) {
      const lc = layerCanvas(l.id);
      const lctx = lc.getContext('2d');
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.clearRect(0, 0, lc.width, lc.height);
      for (const s of strokes) {
        if (s.layer !== l.id) continue;
        if (s.fill) {
          lctx.setTransform(1, 0, 0, 1, 0, 0);
          floodFill(s, lctx);
        } else {
          setTransform(lctx);
          drawStroke(lctx, s);
        }
      }
      lctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    render();
    updateButtons();
  }

  // Composite: white paper, optional grid, visible layers bottom to top with their
  // opacity, then the preview, then the selection outline
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (showGrid) drawGrid();
    for (const l of layers) {
      if (!l.visible) continue;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = l.opacity;
      ctx.drawImage(layerCanvas(l.id), 0, 0);
    }
    ctx.globalAlpha = 1;
    if (preview) {
      setTransform(ctx);
      // Eraser preview shows as a grey guide line; the real erase happens on release
      const p = preview.eraser
        ? { ...preview, eraser: false, color: 'rgba(120,120,120,0.7)' }
        : preview;
      drawStroke(ctx, p);
    }
    if (selected) {
      setTransform(ctx);
      drawSelection(ctx);
    }
  }

  // Coalesce redraws to one per animation frame
  function scheduleRender(full) {
    pendingFull = pendingFull || full;
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      if (pendingFull) { pendingFull = false; redrawInk(); }
      else render();
    });
  }

  // ---------- coordinates ----------
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left - view.ox) / view.scale,
      y: (e.clientY - r.top - view.oy) / view.scale,
      p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5
    };
  }

  // ---------- hit testing ----------
  function nearStroke(pt, s, tol) {
    const pts = s.points, r = (s.size || 0) / 2 + tol;
    if (pts.length === 1) return Math.hypot(pt.x - pts[0].x, pt.y - pts[0].y) <= r;
    for (let i = 1; i < pts.length; i++) {
      if (distSeg(pt, pts[i - 1], pts[i]) <= r) return true;
    }
    return false;
  }

  // Topmost visible item under the point; fills are skipped because their area is not an object
  function hitItem(pt) {
    const tol = 12 / view.scale;
    for (let i = strokes.length - 1; i >= 0; i--) {
      const s = strokes[i];
      if (s.fill) continue;
      const L = layers.find(l => l.id === s.layer);
      if (!L || !L.visible) continue;
      if (s.shape) {
        const b = rawBox(s), pad = (s.size || 0) / 2 + tol;
        if (pt.x >= b.x0 - pad && pt.x <= b.x1 + pad && pt.y >= b.y0 - pad && pt.y <= b.y1 + pad) return s;
      } else if (nearStroke(pt, s, tol)) {
        return s;
      }
    }
    return null;
  }

  // Corner handle under the point, or null. `anchor` is the opposite corner.
  function handleAt(pt) {
    if (!selected) return null;
    const b = rawBox(selected), r = 14 / view.scale;
    const corners = [
      { x: b.x0, y: b.y0, anchor: { x: b.x1, y: b.y1 } },
      { x: b.x1, y: b.y0, anchor: { x: b.x0, y: b.y1 } },
      { x: b.x0, y: b.y1, anchor: { x: b.x1, y: b.y0 } },
      { x: b.x1, y: b.y1, anchor: { x: b.x0, y: b.y0 } }
    ];
    return corners.find(c => Math.abs(c.x - pt.x) <= r && Math.abs(c.y - pt.y) <= r) || null;
  }

  // ---------- move and resize ----------
  function startDrag(kind, item, pt, anchor) {
    drag = {
      kind,
      ref: item,              // the original object, as it appears in the snapshot
      before: snapshot(),
      start: pt,
      anchor,
      orig: item.points.map(p => ({ ...p })),
      box: rawBox(item)
    };
  }

  function updateDrag(q) {
    const d = drag, b = d.box;
    let fn;
    if (d.kind === 'move') {
      let dx = q.x - d.start.x, dy = q.y - d.start.y;
      if (snap) {
        dx = Math.round((b.x0 + dx) / GRID) * GRID - b.x0;
        dy = Math.round((b.y0 + dy) / GRID) * GRID - b.y0;
      }
      fn = p => ({ x: p.x + dx, y: p.y + dy });
    } else {
      const t = snap ? snapPt(q) : q;
      const nb = box(d.anchor, t);
      const w0 = b.x1 - b.x0, h0 = b.y1 - b.y0;
      const sx = w0 > 1e-6 ? (nb.x1 - nb.x0) / w0 : 1;
      const sy = h0 > 1e-6 ? (nb.y1 - nb.y0) / h0 : 1;
      fn = p => ({ x: nb.x0 + (p.x - b.x0) * sx, y: nb.y0 + (p.y - b.y0) * sy });
    }
    const item = { ...d.ref, points: d.orig.map(p => ({ ...fn(p), p: p.p })) };
    strokes = d.before.items.map(s => (s === d.ref ? item : s));
    selected = item;
    scheduleRender(true);
  }

  function finishDrag() {
    if (strokes !== drag.before.items) pushHistory(drag.before);
    drag = null;
    activePointerId = null;
    scheduleRender(true);
    updateButtons();
  }

  function cancelDrag() {
    strokes = drag.before.items;
    drag = null;
    activePointerId = null;
    scheduleRender(true);
  }

  // ---------- pinch to zoom and pan ----------
  function startGesture() {
    if (drag) cancelDrag();
    if (current && current.pointerType === 'touch') cancelCurrent();
    const [a, b] = [...touches.values()];
    gesture = {
      dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      mx: (a.x + b.x) / 2,
      my: (a.y + b.y) / 2,
      view: { ...view }
    };
  }

  function updateGesture() {
    const [a, b] = [...touches.values()];
    const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = canvas.getBoundingClientRect();
    const s0 = gesture.view.scale;
    const scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, s0 * dist / gesture.dist));
    // The drawing point under the starting midpoint stays under the current midpoint
    const wx = (gesture.mx - r.left - gesture.view.ox) / s0;
    const wy = (gesture.my - r.top - gesture.view.oy) / s0;
    view = { scale, ox: mx - r.left - wx * scale, oy: my - r.top - wy * scale };
    scheduleRender(true);
  }

  function cancelCurrent() {
    current = null;
    activePointerId = null;
    preview = null;
    redrawInk();
  }

  // ---------- pointer handling ----------
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penInUse = true;

    if (e.pointerType === 'touch') {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      canvas.setPointerCapture(e.pointerId);
      if (touches.size >= 2) { startGesture(); return; }
      if (penInUse) return;   // palm rejection: a lone finger doesn't draw once the Pencil is in use
    }

    if (gesture || activePointerId !== null) return;

    const raw = toWorld(e);
    const isShape = SHAPES.includes(tool);
    const dragging = isShape || mode === 'line';   // these need a start and an end point

    // Select: grab a corner to resize, or an object to move; tap empty space to deselect
    if (tool === 'select') {
      activePointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      const corner = handleAt(raw);
      if (selected && corner) {
        startDrag('resize', selected, raw, corner.anchor);
      } else {
        selected = hitItem(raw);
        if (selected) {
          activeLayer = selected.layer;
          startDrag('move', selected, raw, null);
        } else {
          activePointerId = null;
        }
      }
      renderLayerList();
      scheduleRender(false);
      updateButtons();
      return;
    }

    // Fill: one tap paints the area under it, on the active layer
    if (tool === 'fill') {
      pushHistory(snapshot());
      strokes = [...strokes, { layer: activeLayer, fill: true, color, x: raw.x, y: raw.y }];
      redrawInk();
      return;
    }

    activePointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);

    const pt = dragging && snap ? snapPt(raw) : raw;
    current = {
      layer: activeLayer,
      color,
      size: tool === 'eraser' ? eraserSize : penSize,
      eraser: tool === 'eraser',
      straight: !isShape && mode === 'line',
      shape: isShape ? tool : null,
      filled: isShape && shapeFilled,
      pointerType: e.pointerType,
      points: dragging ? [pt, { ...pt }] : [raw]
    };
    if (current.straight || current.shape) {
      preview = current;
    } else {
      const lctx = layerCtx(current.layer);
      setTransform(lctx);
      drawStroke(lctx, current);   // a tap shows as a dot
    }
    scheduleRender(false);
  });

  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (gesture) { if (touches.size >= 2) updateGesture(); return; }
    }
    if (gesture) return;

    if (drag) {
      if (e.pointerId === activePointerId) updateDrag(toWorld(e));
      return;
    }

    if (!current || e.pointerId !== activePointerId) return;

    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const dragging = current.straight || current.shape;
    const lctx = layerCtx(current.layer);
    setTransform(lctx);
    for (const ev of events) {
      const pt = toWorld(ev);
      if (dragging) {
        // Arc side: remember the first point the pen moved to, away from the start
        if (current.shape === 'arc' && !current.anchorPt &&
            Math.hypot(pt.x - current.points[0].x, pt.y - current.points[0].y) > 4 / view.scale) {
          current.anchorPt = pt;
        }
        current.points[1] = snap ? snapPt(pt) : pt;
        if (current.anchorPt) {
          const [a, b] = current.points;
          const cross = (b.x - a.x) * (current.anchorPt.y - a.y) - (b.y - a.y) * (current.anchorPt.x - a.x);
          current.side = Math.sign(cross) || 1;
        }
      } else {
        current.points.push(pt);
        drawSegment(lctx, current, current.points, current.points.length - 1);
      }
    }
    if (dragging) preview = current;
    scheduleRender(false);
  });

  function endPointer(e) {
    if (e.pointerType === 'touch') {
      touches.delete(e.pointerId);
      if (touches.size < 2) gesture = null;
    }
    if (drag) {
      if (e.pointerId === activePointerId) finishDrag();
      return;
    }
    if (!current || e.pointerId !== activePointerId) return;
    pushHistory(snapshot());
    strokes = [...strokes, current];
    current = null;
    activePointerId = null;
    preview = null;
    scheduleRender(true);   // rebuild ink so shapes, lines and eraser cuts settle exactly
    updateButtons();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- history ----------
  // A snapshot is the item list plus the layer list. Both are immutable, so keeping
  // references is enough. Layer visibility and opacity are also saved with snapshots.
  function snapshot() {
    return { items: strokes, layers };
  }

  function restore(s) {
    strokes = s.items;
    layers = s.layers;
    if (!strokes.includes(selected)) selected = null;
    if (!layers.some(l => l.id === activeLayer)) activeLayer = layers[layers.length - 1].id;
    renderLayerList();
    redrawInk();
  }

  function pushHistory(before) {
    undoStack.push(before);
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  function deleteSelected() {
    if (!selected) return;
    pushHistory(snapshot());
    strokes = strokes.filter(s => s !== selected);
    selected = null;
    redrawInk();
  }

  function clearAll() {
    if (!strokes.length) return;
    pushHistory(snapshot());
    strokes = [];
    selected = null;
    redrawInk();
  }

  function updateButtons() {
    $('undoBtn').disabled = undoStack.length === 0;
    $('redoBtn').disabled = redoStack.length === 0;
    $('delBtn').disabled = !selected;
  }

  // ---------- layers ----------
  function el(tag, props, ...children) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    for (const c of children) n.append(c);
    return n;
  }

  // Changes layer properties without touching items. Visibility, opacity, and order
  // only need a re-composite, so they are not added to undo history.
  function updateLayer(id, patch, rebuild) {
    layers = layers.map(l => (l.id === id ? { ...l, ...patch } : l));
    if (rebuild) renderLayerList();
    scheduleRender(false);
  }

  function moveLayer(id, dir) {
    const idx = layers.findIndex(l => l.id === id);
    const j = idx + dir;
    if (idx < 0 || j < 0 || j >= layers.length) return;
    const arr = layers.slice();
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    layers = arr;
    renderLayerList();
    scheduleRender(false);
  }

  // Lists layers top first, like a stack of paper
  function renderLayerList() {
    const list = $('layerList');
    list.replaceChildren();
    for (let i = layers.length - 1; i >= 0; i--) {
      const l = layers[i];
      const eye = el('button', { textContent: l.visible ? '👁' : '⊘', title: l.visible ? 'Hide layer' : 'Show layer' });
      eye.onclick = e => { e.stopPropagation(); updateLayer(l.id, { visible: !l.visible }, true); };

      const name = el('span', { className: 'lname', textContent: l.name, title: 'Tap to select, double-tap to rename' });
      name.ondblclick = () => {
        const n = prompt('Layer name', l.name);
        if (n && n.trim()) updateLayer(l.id, { name: n.trim().slice(0, 30) }, true);
      };

      const op = el('input', { type: 'range', min: 0, max: 100, value: Math.round(l.opacity * 100), title: 'Opacity' });
      op.oninput = () => updateLayer(l.id, { opacity: Number(op.value) / 100 }, false);
      op.onclick = e => e.stopPropagation();

      const up = el('button', { textContent: '↑', title: 'Move up', disabled: i === layers.length - 1 });
      up.onclick = e => { e.stopPropagation(); moveLayer(l.id, 1); };
      const down = el('button', { textContent: '↓', title: 'Move down', disabled: i === 0 });
      down.onclick = e => { e.stopPropagation(); moveLayer(l.id, -1); };

      const row = el('div', { className: 'layer-row' + (l.id === activeLayer ? ' active' : '') }, eye, name, op, up, down);
      row.onclick = () => { activeLayer = l.id; renderLayerList(); };
      list.append(row);
    }
  }

  $('layersBtn').onclick = () => {
    const p = $('layerPanel');
    p.hidden = !p.hidden;
    if (!p.hidden) renderLayerList();
  };
  $('closeLayers').onclick = () => { $('layerPanel').hidden = true; };

  $('addLayer').onclick = () => {
    pushHistory(snapshot());
    const id = 'L' + (++layerSeq);
    const idx = layers.findIndex(l => l.id === activeLayer);
    layers = [...layers.slice(0, idx + 1), { id, name: 'Layer ' + layerSeq, visible: true, opacity: 1 }, ...layers.slice(idx + 1)];
    activeLayer = id;
    renderLayerList();
    scheduleRender(false);
    updateButtons();
  };

  $('delLayer').onclick = () => {
    if (layers.length <= 1) { showToast('Keep at least one layer'); return; }
    const idx = layers.findIndex(l => l.id === activeLayer);
    pushHistory(snapshot());
    const id = activeLayer;
    strokes = strokes.filter(s => s.layer !== id);
    layers = layers.filter(l => l.id !== id);
    activeLayer = layers[Math.min(idx, layers.length - 1)].id;
    if (!strokes.includes(selected)) selected = null;
    renderLayerList();
    redrawInk();
  };

  // ---------- export ----------
  // Exports visible layers on white, without the grid, selection, or preview
  function exportCanvas() {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const cx = c.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, c.width, c.height);
    for (const l of layers) {
      if (!l.visible) continue;
      cx.globalAlpha = l.opacity;
      cx.drawImage(layerCanvas(l.id), 0, 0);
    }
    cx.globalAlpha = 1;
    return c;
  }

  function savePNG() {
    exportCanvas().toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `drawing-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  }

  // ---------- copy to clipboard ----------
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyDrawing() {
    if (!navigator.clipboard || !window.ClipboardItem) {
      showToast('Copy not supported here. Use 💾 to save instead.');
      return;
    }
    exportCanvas().toBlob(async blob => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast('Drawing copied to clipboard');
      } catch (err) {
        console.error(err);
        showToast('Copy failed. Try 💾 to save instead.');
      }
    }, 'image/png');
  }

  // ---------- toolbar ----------
  function setGroup(group, el) {
    document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
  }

  const size = $('size');
  const sizeLabel = $('sizeLabel');
  // The slider controls whichever tool is active, with its own range and stored value
  function syncSlider() {
    size.disabled = tool === 'fill' || tool === 'select';
    if (tool === 'eraser') { size.min = 4; size.max = 80; size.value = eraserSize; }
    else { size.min = 1; size.max = 30; size.value = penSize; }
    sizeLabel.textContent = size.value;
  }
  size.addEventListener('input', () => {
    if (tool === 'eraser') eraserSize = Number(size.value);
    else penSize = Number(size.value);
    sizeLabel.textContent = size.value;
  });

  function setTool(t, el) {
    tool = t;
    if (t !== 'select') selected = null;
    setGroup('tool', el);
    syncSlider();
    scheduleRender(false);
    updateButtons();
  }

  $('selectBtn').onclick = e => setTool('select', e.currentTarget);
  $('penBtn').onclick = e => setTool('pen', e.currentTarget);
  $('eraserBtn').onclick = e => setTool('eraser', e.currentTarget);
  $('rectBtn').onclick = e => setTool('rect', e.currentTarget);
  $('ovalBtn').onclick = e => setTool('oval', e.currentTarget);
  $('arcBtn').onclick = e => setTool('arc', e.currentTarget);
  $('fillBtn').onclick = e => setTool('fill', e.currentTarget);

  // Picking any colour switches away from the eraser and select tools, since neither uses colour
  function pickColor(c, el) {
    color = c;
    if (tool === 'eraser' || tool === 'select') setTool('pen', $('penBtn'));
    setGroup('color', el);
  }

  // Six fixed colours
  document.querySelectorAll('button.swatch').forEach(btn => {
    btn.onclick = () => pickColor(btn.dataset.color, btn);
  });

  // Six custom colours: tap to use, then edit in the native RGB picker
  const customInputs = [...document.querySelectorAll('input.custom')];
  customInputs.forEach((inp, i) => {
    inp.value = customColors[i];
    inp.addEventListener('click', () => pickColor(inp.value, inp));
    inp.addEventListener('input', () => {
      customColors[i] = inp.value;
      saveCustom(customColors);
      pickColor(inp.value, inp);
    });
  });

  $('solidBtn').onclick = e => {
    shapeFilled = !shapeFilled;
    e.currentTarget.classList.toggle('active', shapeFilled);
  };

  $('curveBtn').onclick = e => { mode = 'curve'; setGroup('mode', e.currentTarget); };
  $('lineBtn').onclick = e => { mode = 'line'; setGroup('mode', e.currentTarget); };

  $('gridBtn').onclick = e => {
    showGrid = !showGrid;
    e.currentTarget.classList.toggle('active', showGrid);
    render();
  };

  $('snapBtn').onclick = e => {
    snap = !snap;
    e.currentTarget.classList.toggle('active', snap);
  };

  $('gridSpacing').onchange = e => {
    GRID = Number(e.target.value);
    scheduleRender(false);
  };

  $('resetViewBtn').onclick = () => {
    view = { scale: 1, ox: 0, oy: 0 };
    scheduleRender(true);
  };

  $('undoBtn').onclick = undo;
  $('redoBtn').onclick = redo;
  $('delBtn').onclick = deleteSelected;
  $('clearBtn').onclick = () => {
    if (confirm('Clear all layers? You can still undo.')) clearAll();
  };
  $('saveBtn').onclick = savePNG;
  $('copyBtn').onclick = copyDrawing;

  // Keyboard shortcuts for when a keyboard is attached
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); savePNG(); }
    if (!mod && (e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); deleteSelected(); }
  });

  // Prevent iOS double-tap zoom and rubber-band scroll on the canvas
  document.addEventListener('gesturestart', e => e.preventDefault());

  resize();
  syncSlider();
  renderLayerList();
  updateButtons();
})();
</script>
</body>
</html>
